<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 90" width="54" height="90">
  <!--
    Layer conventions (see README.md in this folder):
      data-scope="pole"    drawn once per pole, tile is the viewBox
      data-scope="device"  drawn once (default)
      data-stretch="x"     device layer scaled horizontally over all poles (use fills only)
      data-show="..."      visibility expression, e.g. on,!tripped  pole-n  kind==lamp
      data-center-x="true" text centred across the whole device
      data-terminal="..."  connection point (top/bottom per pole, or a name for device terminals)
      {{token}}            replaced by parameters, e.g. {{In}} {{curve}} {{Icn#label}} {{color#hex}}
  -->
  <g data-layer="body">
    <rect x="0.3" y="0.3" width="53.4" height="89.4" rx="1.8" fill="#eceff3" stroke="#69747f" stroke-width="0.6"/>
    <rect x="2" y="2" width="50" height="14" rx="1" fill="#d3d9e0"/>
  </g>
  <g data-layer="terminals">
    <circle data-terminal="L1" cx="9" cy="8" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M7.2 8h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
    <circle data-terminal="N" cx="27" cy="8" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M25.2 8h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
    <circle data-terminal="PE" cx="45" cy="8" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M43.2 8h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
    <text x="9" y="14.6" font-size="2.6" text-anchor="middle" fill="#4c5560" font-family="Helvetica, Arial, sans-serif">L</text>
    <text x="27" y="14.6" font-size="2.6" text-anchor="middle" fill="#4c5560" font-family="Helvetica, Arial, sans-serif">N</text>
    <text x="45" y="14.6" font-size="2.6" text-anchor="middle" fill="#4c5560" font-family="Helvetica, Arial, sans-serif">PE</text>
  </g>
  <g data-layer="face">
    <circle cx="27" cy="52" r="19" fill="#f7f8fa" stroke="#8993a0" stroke-width="0.8"/>
    <circle cx="27" cy="52" r="15" fill="#e3e7ec" stroke="#8993a0" stroke-width="0.5"/>
    <circle cx="20.5" cy="52" r="2.2" fill="#2b333d"/>
    <circle cx="33.5" cy="52" r="2.2" fill="#2b333d"/>
    <rect x="24.2" y="36.5" width="5.6" height="2.6" rx="0.8" fill="#9aa4af"/>
    <rect x="24.2" y="64.9" width="5.6" height="2.6" rx="0.8" fill="#9aa4af"/>
  </g>
  <g data-layer="powered-led" data-show="powered"><circle cx="46" cy="80" r="2" fill="#2e9e44"/></g>
  <g data-layer="idle-led" data-show="!powered"><circle cx="46" cy="80" r="2" fill="#2e9e44" fill-opacity="0.25"/></g>
  <g data-layer="labels">
    <text data-center-x="true" x="0" y="80" font-size="3.6" fill="#59636e" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">{{In}}A  {{Un}} V</text>
  </g>
</svg>
