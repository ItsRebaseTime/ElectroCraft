<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 40" width="45" height="40">
  <!-- US load center art. data-show flags: side-left / side-right (which column the breaker is in), on, tripped,
       and the device parameters (type==GFCI ...). Terminals marked data-terminal are mirrored for the right column. -->
  <g data-scope="pole" data-layer="body">
    <rect x="0.3" y="0.3" width="44.4" height="39.4" rx="1.8" fill="#353a42" stroke="#15181c" stroke-width="0.6"/>
    <rect x="6" y="1.5" width="33" height="12.5" rx="1" fill="#b9c0c8" stroke="#6b7480" stroke-width="0.4"/>
    <circle data-terminal="line" data-dir="up" cx="22.5" cy="7.8" r="3.8" fill="#8f99a4" stroke="#4c5560" stroke-width="0.5"/><path d="M20.22 7.8h4.56" stroke="#3b444d" stroke-width="0.7"/>
  </g>
  <g data-layer="handle-plate" data-stretch="x"><rect x="4" y="17" width="37" height="14" rx="1.2" fill="#23272d"/></g>
  <g data-layer="handle-on" data-stretch="x" data-show="on,!tripped"><rect x="7" y="18.4" width="31" height="6" rx="1" fill="#e8ebee"/></g>
  <g data-layer="handle-off" data-stretch="x" data-show="!on,!tripped"><rect x="7" y="24" width="31" height="6" rx="1" fill="#9aa1a9"/></g>
  <g data-layer="handle-tripped" data-stretch="x" data-show="tripped"><rect x="7" y="21.2" width="31" height="6" rx="1" fill="#cfd4da"/><rect x="7" y="28" width="31" height="1.6" fill="#f08a24"/></g>
  <g data-layer="labels">
    <text x="0" y="37.2" font-size="4.6" text-anchor="middle" fill="#ffd84a" font-family="Helvetica, Arial, sans-serif" data-center-x="true" font-weight="bold">MAIN {{In}} A</text>
  </g>
</svg>
