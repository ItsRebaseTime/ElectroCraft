<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 90" width="18" height="90">
  <!--
    Layer conventions (see README.md in this folder):
      data-scope="pole"    drawn once per pole, tile is the viewBox
      data-scope="device"  drawn once (default)
      data-stretch="x"     device layer scaled horizontally over all poles (use fills only)
      data-show="..."      visibility expression, e.g. on,!tripped  pole-n  kind==lamp
      data-center-x="true" text centred across the whole device
      data-terminal="..."  connection point (top/bottom per pole, or a name for device terminals)
      {{token}}            replaced by parameters, e.g. {{In}} {{curve}} {{Icn#label}} {{color#hex}}
  -->
  <g data-scope="pole" data-layer="body">
    <rect x="0.3" y="0.3" width="17.4" height="89.4" rx="1.6" fill="#ece8dc" stroke="#69747f" stroke-width="0.6"/>
    <rect x="1.6" y="1.6" width="14.8" height="12" rx="1" fill="#d9d3c0"/>
    <rect x="1.6" y="76.4" width="14.8" height="12" rx="1" fill="#d9d3c0"/>
    <circle data-terminal="top" cx="9" cy="7.6" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M7.2 7.6h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
    <circle data-terminal="bottom" cx="9" cy="82.4" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M7.2 82.4h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
  </g>
  <g data-scope="pole" data-layer="neutral-tag" data-show="pole-n">
    <rect x="1.6" y="15" width="14.8" height="4" rx="0.8" fill="#1f6fd1"/>
    <text x="9" y="18" font-size="3.2" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">N</text>
  </g>
  <g data-layer="label-plate" data-stretch="x"><rect x="1.8" y="20" width="14.4" height="54" fill="#ece8dc"/></g>
  <g data-scope="pole" data-layer="carrier-closed" data-show="on,!tripped"><rect x="2.4" y="26" width="13.2" height="40" rx="1.6" fill="#f6f2e4" stroke="#b3ab8e" stroke-width="0.4"/><rect x="5.4" y="33" width="7.2" height="26" rx="1" fill="#e4dcc2" stroke="#b3ab8e" stroke-width="0.3"/></g>
  <g data-scope="pole" data-layer="carrier-open" data-show="!on"><rect x="2.4" y="46" width="13.2" height="20" rx="1.6" fill="#f6f2e4" stroke="#b3ab8e" stroke-width="0.4"/><rect x="5.4" y="50" width="7.2" height="12" rx="1" fill="#e4dcc2"/><path d="M3 44h12" stroke="#b3ab8e" stroke-width="0.6" stroke-dasharray="1.2 1.2"/></g>
  <g data-scope="pole" data-layer="fuse-blown" data-show="tripped"><rect x="2.4" y="26" width="13.2" height="40" rx="1.6" fill="#f6f2e4" stroke="#b3ab8e" stroke-width="0.4"/><rect x="5.4" y="33" width="7.2" height="26" rx="1" fill="#d1342f"/></g>
  <g data-layer="labels">
    <text data-center-x="true" x="0" y="23.8" font-size="3.8" fill="#1f2630" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">{{class}} {{In}}A</text>
    <text data-center-x="true" x="0" y="72" font-size="3" fill="#59636e" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">{{Un}} V</text>
  </g>
</svg>
