<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 90" width="27" height="90">
  <!--
    Layer conventions (see README.md in this folder):
      data-scope="pole"    drawn once per pole, tile is the viewBox
      data-scope="device"  drawn once (default)
      data-stretch="x"     device layer scaled horizontally over all poles (use fills only)
      data-show="..."      visibility expression, e.g. on,!tripped  pole-n  kind==lamp
      data-center-x="true" text centred across the whole device
      data-terminal="..."  connection point (top/bottom per pole, or a name for device terminals)
      {{token}}            replaced by parameters, e.g. {{In}} {{curve}} {{Icn#label}} {{color#hex}}
  -->
  <g data-scope="pole" data-layer="body">
    <rect x="0.3" y="0.3" width="26.4" height="89.4" rx="1.6" fill="#e7eaed" stroke="#69747f" stroke-width="0.6"/>
    <rect x="1.6" y="1.6" width="23.8" height="12" rx="1" fill="#d3d9e0"/>
    <rect x="1.6" y="76.4" width="23.8" height="12" rx="1" fill="#d3d9e0"/>
    <circle data-terminal="top" cx="13.5" cy="7.6" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M11.7 7.6h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
    <circle data-terminal="bottom" cx="13.5" cy="82.4" r="3" fill="#9aa4af" stroke="#4c5560" stroke-width="0.5"/><path d="M11.7 82.4h3.5999999999999996" stroke="#3b444d" stroke-width="0.7"/>
  </g>
  <g data-scope="pole" data-layer="neutral-tag" data-show="pole-n">
    <rect x="1.6" y="15" width="23.8" height="4" rx="0.8" fill="#1f6fd1"/>
    <text x="13.5" y="18" font-size="3.2" fill="#ffffff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">N</text>
  </g>
  <g data-layer="label-plate" data-stretch="x"><rect x="2.7" y="20" width="21.6" height="54" fill="#e7eaed"/></g>
  <g data-layer="lcd" data-stretch="x"><rect x="2" y="25" width="23" height="14" rx="1" fill="#2c3a32"/></g>
  <g data-layer="readout">
    <text data-center-x="true" x="0" y="34.2" font-size="5" fill="#b9f5c5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">{{current}}</text>
  </g>
  <g data-layer="labels">
    <text data-center-x="true" x="0" y="50" font-size="4" fill="#1f2630" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">kWh meter</text>
    <text data-center-x="true" x="0" y="56" font-size="3.2" fill="#59636e" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Imax {{In}} A  cl. {{class}}</text>
  </g>
</svg>
