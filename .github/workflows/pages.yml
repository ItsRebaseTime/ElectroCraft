# Builds the app and publishes it to GitHub Pages: https://itsrebasetime.github.io/ElectroCraft/
# One-time setup: repository Settings > Pages > Source: "GitHub Actions". Until that is done the build job
# passes but the deploy job fails with "Get Pages site failed" / "Not Found".
# (No configure-pages step: the app is built with relative asset paths, so it needs no base-path detection.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
